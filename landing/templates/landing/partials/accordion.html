{% load static %}

<section class="container py-3">
  <div class="accordion-wrapper">
    <button type="button" class="accordion-toggle" id="{{ accordion_id|default:'accordion-toggle' }}">
      {{ accordion_title|default:"Нормативные документы в сфере независимой оценки квалификации" }}
      <img
        src="{% static 'landing/img/Vector.svg' %}"
        alt="toggle"
        class="accordion-icon"
      />
    </button>

    <div class="accordion-content" id="{{ accordion_content_id|default:'accordion-content' }}">
      {% if accordion_include %}
        {% include accordion_include %}
      {% elif accordion_items %}
        <ul class="normative-list">
          {% for item in accordion_items %}
            <li>{{ item }}</li>
          {% endfor %}
        </ul>
      {% elif accordion_content %}
        {{ accordion_content|safe }}
      {% endif %}
    </div>
  </div>
</section>
